# osv-scanner ignore-list for uv.lock vulnerability scanning (`make audit` + CI audit job).
#
# forecasting-tools was unfrozen 0.2.54 -> 0.2.92 on 2026-07-23, which cleared the bulk
# of the old backlog:
#   - litellm advanced 1.80.0 -> 1.92.0 (past every previously-ignored litellm CVE), so
#     ALL litellm entries were removed — none fire at 1.92.0.
#   - cryptography advanced 45.0.4 -> 46.0.6 (asknews bumped 0.11.32 -> 0.13.54, whose
#     `cryptography<46.0.7` cap now sits above the old 45.x pin). Two of the four old
#     cryptography advisories are fixed at 46.0.6 and were removed; the two below still
#     fire at 46.0.6, and their fixes (46.0.7 / 48.0.1) are unreachable while asknews
#     caps cryptography <46.0.7. Drop them once asknews lifts that cap.
#   - pillow / transformers / pydantic-settings uv workarounds (override/exclude
#     dependencies) were deleted from pyproject.toml at the bump; none of those packages
#     resolve to a vulnerable version anymore.
#
# 2026-08-17: three further cryptography advisories (CVE-2026-69247/69248/69249) disclosed
# against 46.0.6, blocked by the SAME asknews cap and waived below. asknews 0.13.56 (latest
# on PyPI as of this date) still declares `cryptography<46.0.7,>=40.0.0`, so bumping asknews
# does NOT lift the cap — re-check its metadata, not just its version, before retrying.
# The cap is the only blocker: 49.0.0 (2026-06-12) and 50.0.0 (2026-07-31) both predate the
# lock-time `exclude-newer` freshness window, and `uv lock --upgrade-package cryptography`
# leaves 46.0.6 in place. cryptography is not a direct dependency and this repo imports it
# nowhere; it arrives transitively via asknews, google-auth, and pyjwt[crypto].
# The concurrently-disclosed aiohttp advisories were NOT waived — aiohttp went 3.14.1 ->
# 3.14.3, which fixes all three outright.
#
# The scan stays LIVE for any NEW CVE not listed here — only these five enumerated,
# accepted advisories are suppressed. Re-evaluate this list at the next forecasting-tools
# or asknews bump (re-run `make audit` and prune resolved IDs).
#
# review-by: 2026-10-23  (re-audit quarterly, or at the next forecasting-tools / asknews
#            bump, whichever comes first)

# PYSEC-2026-36 is an alias of GHSA-p423-j2cm-9vmq (CVE-2026-39892); osv-scanner matches
# via the GHSA and reports the PYSEC alias as "unused", so it is intentionally omitted.
[[IgnoredVulns]]
id = "GHSA-p423-j2cm-9vmq"
reason = "cryptography 46.0.6 buffer overflow when non-contiguous buffers are passed to APIs (CVE-2026-39892, CVSS 9.8); fix 46.0.7 unreachable while asknews 0.13.54 caps cryptography <46.0.7"
[[IgnoredVulns]]
id = "GHSA-537c-gmf6-5ccf"
reason = "cryptography 46.0.6 wheels bundle a vulnerable OpenSSL (CVSS 7.5); fix 48.0.1 unreachable while asknews 0.13.54 caps cryptography <46.0.7"
[[IgnoredVulns]]
id = "GHSA-jwv3-5hgf-82ww"
reason = "cryptography 46.0.6 exponential path-building on chains with duplicate self-signed intermediates, a resource-exhaustion DoS (CVE-2026-69249, CVSS 8.7); fix 49.0.0 unreachable while asknews 0.13.54 caps cryptography <46.0.7. Not reached: we build and verify no X.509 chains."
[[IgnoredVulns]]
id = "GHSA-g6cj-pr64-35w5"
reason = "cryptography 46.0.6 PKCS#7 EnvelopedData decryption leaks a Bleichenbacher oracle via distinguishable errors and timing (CVE-2026-69247, CVSS 8.2); fix 50.0.0 unreachable while asknews 0.13.54 caps cryptography <46.0.7. Not reached: we decrypt no attacker-supplied PKCS#7."
[[IgnoredVulns]]
id = "GHSA-m2h6-j472-rp4c"
reason = "cryptography 46.0.6 verifier accepts a wildcard DNS SAN that escapes an intermediate CA's permittedSubtrees name constraint (CVE-2026-69248, CVSS 6.9); fix 49.0.0 unreachable while asknews 0.13.54 caps cryptography <46.0.7. Not reached: we build and verify no X.509 chains."

# 2026-11-03: a 97-advisory wave across 10 packages. brotli, certifi, dnspython, filelock, pyasn1,
# tornado and virtualenv were bumped past every fix, and pypdf to 6.21.2. Waived below:
#   - litellm GHSA-7hp6-4w63-5g45: a LiteLLM PROXY admin-salt escalation. We import litellm as a
#     client library and never run its proxy, and the 1.98 -> 1.100.4 jump would swap the client
#     every model call goes through mid-season. Bump with the next forecasting-tools unfreeze.
#   - pillow 12.3.0 (41 advisories, all fixed in 13.0.0): streamlit 1.62.0 and forecasting-tools
#     0.2.92 both cap pillow <13, so 13.0.0 is unreachable. Fetched images reach Image.open only
#     through research/image_assets.py in agentic gap-fill v2, which this fork's workflows run with
#     GAP_FILL_V2_ENABLED=false. Re-check if gap-fill v2 is switched on or either cap lifts.
#   - pypdf 6.21.2: seven parse DoS advisories fixed in 6.21.3 (2026-10-27) / 6.21.4 (2026-10-28),
#     both still inside the lock's one-week exclude-newer window. Each expires 2026-11-10; bump then.
#     http_fetch's byte cap and the fetch wall clock already bound a pathological parse.
[[IgnoredVulns]]
id = "GHSA-7hp6-4w63-5g45"
reason = "litellm 1.98.0 proxy privilege escalation (CVSS 9.9); fix 1.100.4. Not reached: we never run the LiteLLM proxy"
[[IgnoredVulns]]
id = "GHSA-27h8-gf7j-v5hc"
reason = "pillow 12.3.0 (CVSS 8.2) (alias PYSEC-2026-4326); fix 13.0.0 unreachable while streamlit 1.62.0 and forecasting-tools 0.2.92 cap pillow <13. Not reached: untrusted images are decoded only by agentic gap-fill v2, which is off in this fork"
